<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>情侣测字 · 一测姻缘</title>
<meta name="description" content="情侣姓名测字，输入双方名字，测笔画五行，断姻缘数理，抽取爱情签文。">
<style>
:root{
  --paper:#F7F1E3;        /* 宣纸米白 */
  --paper-deep:#EFE6D0;
  --ink:#2B2823;          /* 墨黑 */
  --ink-soft:#5A5346;
  --cinnabar:#B03A2E;     /* 朱砂红 */
  --cinnabar-deep:#8E2C22;
  --gold:#C9A24B;         /* 鎏金 */
  --gold-soft:#E4CE9C;
  --line:rgba(139,116,70,.25);
  --shadow:0 10px 30px rgba(80,60,30,.12);
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:"STSong","Songti SC","SimSun","Noto Serif SC",serif;
  background:
    radial-gradient(1200px 600px at 50% -100px, rgba(201,162,75,.10), transparent 60%),
    linear-gradient(180deg,#FBF6EA 0%, var(--paper) 30%, var(--paper-deep) 100%);
  color:var(--ink);
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 60px;position:relative}

/* ===== 顶部印章与标题 ===== */
.hero{text-align:center;padding:26px 0 8px;position:relative}
.seal{
  width:64px;height:64px;margin:0 auto 12px;
  background:var(--cinnabar);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:#FBF6EA;font-size:36px;font-weight:700;
  box-shadow:0 6px 16px rgba(176,58,46,.35);
  transform:rotate(-3deg);
  position:relative;
}
.seal::after{content:"";position:absolute;inset:5px;border:1.5px solid rgba(251,246,234,.55);border-radius:6px}
.hero h1{font-size:30px;letter-spacing:8px;font-weight:700;margin-left:8px}
.hero .sub{color:var(--ink-soft);font-size:13px;letter-spacing:4px;margin-top:8px}
.hero .redcord{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;color:var(--cinnabar)}
.hero .redcord .line{height:1.5px;width:44px;background:linear-gradient(90deg,transparent,var(--cinnabar))}
.hero .redcord .line:last-child{background:linear-gradient(90deg,var(--cinnabar),transparent)}

/* ===== 输入卡片 ===== */
.card{
  background:rgba(255,252,244,.72);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:24px 20px;
  margin-top:22px;
  backdrop-filter:blur(4px);
}
.card .lbl{font-size:13px;color:var(--ink-soft);letter-spacing:3px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card .lbl .dot{width:6px;height:6px;background:var(--cinnabar);border-radius:50%}
.input-row{display:flex;gap:12px;margin-bottom:14px}
.input-box{flex:1}
.input-box input{
  width:100%;padding:14px 14px;
  font-family:inherit;font-size:18px;letter-spacing:2px;
  border:1.5px solid var(--line);border-radius:12px;
  background:#FDFAF0;color:var(--ink);
  transition:border-color .2s;
}
.input-box input:focus{outline:none;border-color:var(--cinnabar)}
.input-box input::placeholder{color:#B7AE9A;letter-spacing:1px;font-size:14px}
.btn{
  width:100%;padding:16px;
  background:linear-gradient(135deg,var(--cinnabar),var(--cinnabar-deep));
  color:#FBF6EA;font-family:inherit;font-size:18px;letter-spacing:6px;font-weight:700;
  border:none;border-radius:12px;cursor:pointer;
  box-shadow:0 8px 20px rgba(176,58,46,.3);
  transition:transform .15s, box-shadow .2s;
  margin-top:6px;
}
.btn:active{transform:scale(.97)}
.btn.ghost{
  background:transparent;color:var(--cinnabar);
  border:1.5px solid var(--cinnabar);
  box-shadow:none;margin-top:12px;font-size:15px;letter-spacing:4px;
}
.hint{font-size:12px;color:#9B927C;text-align:center;margin-top:12px;letter-spacing:1px}

/* ===== 结果区 ===== */
#result{display:none;margin-top:26px;animation:fadeIn .5s ease}
#result.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.panel-title{
  display:flex;align-items:center;gap:10px;
  font-size:16px;letter-spacing:4px;font-weight:700;
  margin:24px 0 14px;color:var(--ink);
}
.panel-title::before{content:"";width:4px;height:16px;background:var(--cinnabar);border-radius:2px}
.panel-title .en{font-size:11px;color:#B7AE9A;letter-spacing:2px;font-weight:400}

/* 缘分指数 */
.score-card{
  background:linear-gradient(160deg,#2F2A22 0%, #3D352A 55%, #4A3F30 100%);
  border-radius:var(--radius);padding:26px 20px 22px;
  color:#F7F1E3;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.score-card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(500px 200px at 80% -30px, rgba(201,162,75,.25), transparent 60%);
}
.score-card::after{
  content:"";position:absolute;inset:8px;border:1px solid rgba(201,162,75,.25);border-radius:12px;pointer-events:none;
}
.score-head{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.score-head .names{font-size:17px;letter-spacing:2px}
.score-head .names b{color:var(--gold-soft);font-weight:700}
.score-ring{
  position:relative;width:150px;height:150px;margin:16px auto 4px;
}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .bg{fill:none;stroke:rgba(247,241,227,.15);stroke-width:9}
.score-ring .fg{
  fill:none;stroke:url(#goldGrad);stroke-width:9;stroke-linecap:round;
  transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1);
}
.score-ring .num{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.score-ring .num .val{font-size:44px;font-weight:700;color:#F7F1E3;line-height:1}
.score-ring .num .unit{font-size:12px;color:var(--gold-soft);letter-spacing:2px;margin-top:4px}
.score-tag{
  text-align:center;font-size:20px;letter-spacing:6px;color:var(--gold-soft);font-weight:700;position:relative;z-index:1;
}
.score-line{display:flex;justify-content:center;gap:14px;margin-top:8px;position:relative;z-index:1}
.score-line span{font-size:12px;color:rgba(247,241,227,.7);letter-spacing:1px}
.score-line b{color:#F7F1E3;font-weight:700}

/* 逐字测字 */
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.char-cell{
  background:rgba(255,252,244,.85);border:1px solid var(--line);border-radius:12px;
  padding:14px 10px;text-align:center;box-shadow:0 4px 12px rgba(80,60,30,.06);
}
.char-cell .ch{font-size:34px;font-weight:700;color:var(--ink)}
.char-cell .py{font-size:12px;color:#9B927C;letter-spacing:1px;margin-top:2px}
.char-cell .meta{display:flex;justify-content:center;gap:8px;margin-top:8px;font-size:12px}
.char-cell .meta i{font-style:normal;padding:2px 7px;border-radius:6px;background:var(--paper-deep);color:var(--ink-soft)}
.char-cell .wx{background:rgba(176,58,46,.12);color:var(--cinnabar-deep);font-weight:700}
.char-cell .is-self{border-color:var(--gold);box-shadow:0 4px 14px rgba(201,162,75,.18)}
.char-cell .self-tag{font-size:11px;color:var(--gold);letter-spacing:1px;margin-top:4px}

/* 分析列表 */
.analy{
  background:rgba(255,252,244,.85);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 18px;box-shadow:0 4px 12px rgba(80,60,30,.06);
}
.analy .row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px dashed rgba(139,116,70,.18);font-size:14px}
.analy .row:last-child{border-bottom:none}
.analy .row .k{color:var(--ink-soft);letter-spacing:1px}
.analy .row .v{font-weight:700;letter-spacing:1px}
.analy .row .v.good{color:#2E7D4F}
.analy .row .v.bad{color:var(--cinnabar-deep)}
.analy .row .v.mid{color:#B8860B}
.analy .row .v.lg{font-size:17px}

/* 签文 */
.qian-card{
  background:linear-gradient(180deg,#FDFAF0,#F4ECDA);
  border:1.5px solid var(--gold);border-radius:var(--radius);
  padding:24px 20px;text-align:center;position:relative;box-shadow:var(--shadow);
}
.qian-card::before,.qian-card::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--gold);border-radius:4px}
.qian-card::before{top:8px;left:8px;border-right:none;border-bottom:none}
.qian-card::after{bottom:8px;right:8px;border-left:none;border-top:none}
.qian-level{display:inline-block;background:var(--cinnabar);color:#FBF6EA;font-size:13px;letter-spacing:3px;padding:4px 14px;border-radius:20px;margin-bottom:14px}
.qian-poem{font-size:19px;line-height:1.9;letter-spacing:2px;color:var(--ink);font-weight:700}
.qian-from{font-size:13px;color:var(--ink-soft);margin-top:12px;letter-spacing:1px}
.qian-tip{font-size:13px;color:#9B927C;margin-top:16px;line-height:1.7;letter-spacing:1px}

/* 五行关系 */
.wx-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.wx-tag{padding:5px 12px;border-radius:16px;font-size:13px;border:1px solid var(--line);background:var(--paper-deep)}
.wx-tag b{font-weight:700}
.wx-tag.wx-jin{color:#B8860B}
.wx-tag.wx-mu{color:#2E7D4F}
.wx-tag.wx-shui{color:#1B6A8F}
.wx-tag.wx-huo{color:var(--cinnabar)}
.wx-tag.wx-tu{color:#8B6914}

/* 页脚 */
.foot{margin-top:34px;text-align:center;font-size:11px;color:#9B927C;line-height:1.9;letter-spacing:1px}
.foot .src{color:#B7AE9A}

/* 抖音适配 */
.dy-badge{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);border-radius:20px;padding:4px 12px;
  font-size:11px;color:var(--ink-soft);margin-top:14px;letter-spacing:1px;
}
.dy-badge svg{width:14px;height:14px}
@media (max-width:360px){
  .input-row{flex-direction:column}
  .score-ring{width:130px;height:130px}
  .score-ring .num .val{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="seal">测</div>
    <h1>情侣测字</h1>
    <div class="sub">一 测 姻 缘 · 字 里 乾 坤</div>
    <div class="redcord"><span class="line"></span><span style="font-size:16px">♥</span><span class="line"></span></div>
  </header>

  <section class="card" id="inputCard">
    <div class="lbl"><span class="dot"></span>输入双方姓名，测一测你们的缘分</div>
    <div class="input-row">
      <div class="input-box">
        <input id="nameA" maxlength="6" placeholder="TA 的名字" autocomplete="off">

      <div class="input-box">
        <input id="nameB" maxlength="6" placeholder="你的名字" autocomplete="off">
      </div>
    </div>
    <button class="btn" id="btnGo">开 始 测 字</button>
    <div class="hint">支持姓、名、情侣昵称，2-6 个汉字为宜</div>
    <div class="hint"><a href="javascript:demo()" style="color:var(--cinnabar);text-decoration:underline">试试示例：林晚晴 × 沈慕白</a></div>
  </section>

  <div id="result"></div>

  <footer class="foot">
    仅供娱乐参考 · 数据源自开源汉字库与古典诗词<br>
    <span class="src">笔画/五行：通用规范汉字表 · 数理：81数理吉凶 · 签文：chinese-poetry</span>
    <div class="dy-badge">

  </footer>
</div>

/* ================= 测字核心逻辑 ================= */
const WX_SHENG = { "木":"火", "火":"土", "土":"金", "金":"水", "水":"木" }; // 相生
const WX_KE   = { "木":"土", "土":"水", "水":"火", "火":"金", "金":"木" }; // 相克

// 归一化名字为单字数组
function toChars(s){
  s = (s||"").trim().replace(/\s+/g,"");
  return [...s].filter(ch=>/[\u4e00-\u9fa5]/.test(ch));
}

// 查单字信息：返回 {ch, stroke, wx, py}
function lookChar(ch){
  const d = HANZI[ch];
  return d ? {ch, stroke:d[0], wx:d[1], py:d[2]} : {ch, stroke:0, wx:"?", py:"?"};
}

// 计算名字笔画总和与五行聚合
function nameProfile(chars){
  let stroke = 0;
  const wxCount = {};
  chars.forEach(c=>{
    const info = lookChar(c);
    stroke += info.stroke;
    if(info.wx !== "?") wxCount[info.wx] = (wxCount[info.wx]||0)+1;
  });
  // 五行取出现最多者，平票按顺序
  let mainWx = "?";
  let max = 0;
  ["木","火","土","金","水"].forEach(w=>{
    if((wxCount[w]||0) > max){ max = wxCount[w]; mainWx = w; }
  });
  return { stroke, mainWx, wxCount };
}

// 数理吉凶分值
function shuliScore(n){
  if(n<1 || n>81) n = ((n-1)%81)+1;
  const s = SHULI[n];
  if(!s) return {n, name:"", luck:"", text:"", score:0};
  const luck = s[1];
  const score = luck==="吉" ? 10 : (luck==="半吉" ? 4 : 0);
  return { n, name:s[0], luck, text:s[2], score };
}

// 缘分综合测算
function fortune(aStr, bStr){
  const aCh = toChars(aStr), bCh = toChars(bStr);
  const aPro = nameProfile(aCh), bPro = nameProfile(bCh);
  const total = aPro.stroke + bPro.stroke;
  const shuli = shuliScore(total);

  // 五行关系
  let wxRel = "同";
  let wxText = "五行同气，性情相合";
  if(aPro.mainWx !== "?" && bPro.mainWx !== "?" && aPro.mainWx !== bPro.mainWx){
    if(WX_SHENG[aPro.mainWx] === bPro.mainWx || WX_SHENG[bPro.mainWx] === aPro.mainWx){
      wxRel = "生"; wxText = aPro.mainWx + "与" + bPro.mainWx + "相生，滋养互补";
    } else if(WX_KE[aPro.mainWx] === bPro.mainWx || WX_KE[bPro.mainWx] === aPro.mainWx){
      wxRel = "克"; wxText = aPro.mainWx + "与" + bPro.mainWx + "相克，需要磨合";
    } else {
      wxRel = "和"; wxText = aPro.mainWx + "与" + bPro.mainWx + "五行平和";
    }
  }

  // 缘分指数：笔画差 + 五行 + 数理 + 笔画匹配
  let score = 50;
  const diff = Math.abs(aPro.stroke - bPro.stroke);
  if(diff === 0) score += 16;
  else if(diff <= 2) score += 12;
  else if(diff <= 5) score += 7;
  else if(diff <= 9) score += 3;
  if(wxRel === "生") score += 14;
  else if(wxRel === "同") score += 9;
  else if(wxRel === "和") score += 6;
  else if(wxRel === "克") score -= 6;
  score += shuli.score;
  // 总笔画数理倾向
  if(shuli.luck === "吉") score += 4;
  // 字数相近加分
  if(aCh.length && aCh.length === bCh.length) score += 3;
  score = Math.max(20, Math.min(99, Math.round(score)));

  // 档位
  let level, qianPool;
  if(score >= 88){ level = "天作之合"; qianPool = QIAN.filter(q=>q[2]==="天作之合"); }
  else if(score >= 76){ level = "琴瑟和鸣"; qianPool = QIAN.filter(q=>q[2]==="琴瑟和鸣"); }
  else if(score >= 62){ level = "情投意合"; qianPool = QIAN.filter(q=>q[2]==="情投意合"); }
  else if(score >= 45){ level = "缘浅情深"; qianPool = QIAN.filter(q=>q[2]==="缘浅情深"); }
  else { level = "陌路红尘"; qianPool = QIAN.filter(q=>q[2]==="陌路红尘"); }

  // 抽取签文：以名字哈希稳定选取
  let seed = 0;
  [...aStr, ...bStr].forEach(ch=>{ seed = (seed*31 + (ch.codePointAt(0)||0)) % 9973; });
  const qi = qianPool.length ? qianPool[seed % qianPool.length] : QIAN[0];
  const scorePct = Math.round(score);

  return {
    aCh, bCh, aPro, bPro, total, shuli, wxRel, wxText, score, scorePct,
    level, qian: qi, seed
  };
}

const $ = id => document.getElementById(id);

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render(r){

  // 兜底：确保双方名字字符串可用
  if(!r.aStr && r.aCh) r.aStr = r.aCh.join("");

  const strokeSumA = r.aPro.stroke;

  // 五行标签样式
  const wxCls = w => ({金:"wx-jin",木:"wx-mu",水:"wx-shui",火:"wx-huo",土:"wx-tu"}[w] || "");

  const aCells = r.aCh.map(c=>{
    const info = lookChar(c);
    return `<div class="char-cell"><div class="ch">${esc(c)}</div><div class="py">${esc(info.py)}</div>
      <div class="meta"><i>${info.stroke}画</i><i class="wx">${esc(info.wx)}</i></div>
      <div class="self-tag">TA</div></div>`;
  }).join("");
  const bCells = r.bCh.map(c=>{
    const info = lookChar(c);
    return `<div class="char-cell is-self"><div class="ch">${esc(c)}</div><div class="py">${esc(info.py)}</div>
      <div class="meta"><i>${info.stroke}画</i><i class="wx">${esc(info.wx)}</i></div>
      <div class="self-tag">你</div></div>`;
  }).join("");

  // 数理样式
  const luckCls = r.shuli.luck==="吉" ? "good" : (r.shuli.luck==="凶" ? "bad" : "mid");

  // 圆环
  const R = 62, C = 2*Math.PI*R;
  const dash = (r.scorePct/100) * C;

  // 五行聚合
  const aWxTags = Object.keys(r.aPro.wxCount).map(w=>`<span class="wx-tag ${wxCls(w)}"><b>${w}</b> ×${r.aPro.wxCount[w]}</span>`).join("");
  const bWxTags = Object.keys(r.bPro.wxCount).map(w=>`<span class="wx-tag ${wxCls(w)}"><b>${w}</b> ×${r.bPro.wxCount[w]}</span>`).join("");

  el.innerHTML = `
    <div class="score-card">
      <svg width="0" height="0"><defs><linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E4CE9C"/><stop offset="100%" stop-color="#C9A24B"/>
      </linearGradient></defs></svg>
      <div class="score-head">
        <div class="names"><b>${esc(r.aStr)}</b> · <b>${esc(r.bStr)}</b></div>
        <div class="names" style="font-size:12px;color:rgba(247,241,227,.7)">缘分指数</div>
      </div>
      <div class="score-ring">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle class="bg" cx="75" cy="75" r="${R}"/>
          <circle class="fg" cx="75" cy="75" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C - dash}" stroke-width="9"/>
        </svg>
        <div class="num"><div class="val">${r.scorePct}</div><div class="unit">分 / 100</div></div>
      </div>
      <div class="score-tag">${esc(r.level)}</div>
      <div class="score-line"><span>TA 笔画 <b>${strokeSumA}</b></span><span>你 笔画 <b>${strokeSumB}</b></span><span>总 <b>${r.total}</b></span></div>
    </div>

    <div class="panel-title">逐字测字<span class="en">CHARACTER</span></div>
    <div class="char-grid">${aCells}${bCells}</div>

    <div class="panel-title">数理分析<span class="en">NUMEROLOGY</span></div>
    <div class="analy">
      <div class="row"><span class="k">姓名总笔画</span><span class="v lg">${r.total} 画</span></div>
      <div class="row"><span class="k">对应数理</span><span class="v lg">第 ${r.shuli.n} 数 · ${esc(r.shuli.name)}</span></div>
      <div class="row"><span class="k">吉凶</span><span class="v ${luckCls}">${esc(r.shuli.luck)}</span></div>
      <div class="row"><span class="k">数理释义</span><span class="v" style="font-weight:400;font-size:13px;max-width:62%;text-align:right">${esc(r.shuli.text)}</span></div>
    </div>

    <div class="panel-title">五行关系<span class="en">ELEMENTS</span></div>
    <div class="analy">
      <div class="row"><span class="k">TA 五行</span><span class="v"><span class="wx-tags" style="justify-content:flex-end">${aWxTags || "—"}</span></span></div>
      <div class="row"><span class="k">你的五行</span><span class="v"><span class="wx-tags" style="justify-content:flex-end">${bWxTags || "—"}</span></span></div>
      <div class="row"><span class="k">相生相克</span><span class="v ${r.wxRel==='克'?'bad':(r.wxRel==='生'?'good':'mid')}">${esc(r.wxText)}</span></div>
    </div>

    <div class="panel-title">测字签文<span class="en">ORACLE</span></div>
    <div class="qian-card">
      <div class="qian-level">${esc(r.level)}</div>
      <div class="qian-poem">${esc(r.qian[0])}</div>
      <div class="qian-from">—— ${esc(r.qian[1])}</div>
      <div class="qian-tip">${esc(qianTip(r))}</div>
    </div>

    <button class="btn ghost" onclick="resetPage()">再 测 一 次</button>
  `;
  el.classList.add("show");
  $("inputCard").style.display = "none";
  window.scrollTo({top:0, behavior:"smooth"});
}

function qianTip(r){
  const tips = {
    "天作之合":"此签大吉，你们的缘分如星月同辉，好好珍惜眼前人。",
    "琴瑟和鸣":"此签上吉，心有灵犀，彼此滋养，是让人羡慕的一对。",
    "情投意合":"此签中吉，有缘相聚，感情需要用心经营，越处越深。",
    "缘浅情深":"此签中平，缘分尚浅，但情深意切，跨过磨合便是晴天。",
    "陌路红尘":"此签平缓，缘分尚待机缘，不妨先做知己，静待花开。"
  };
  return tips[r.level] || "";
}

function resetPage(){
  $("result").classList.remove("show");
  $("result").innerHTML = "";
  $("inputCard").style.display = "block";
  $("nameA").value = ""; $("nameB").value = "";
  $("nameA").focus();
}

function go(){
  const a = $("nameA").value.trim();
  const b = $("nameB").value.trim();
  if(!toChars(a).length || !toChars(b).length){
    alert("请分别输入双方的名字（至少 1 个汉字）");
    return;
  }
  const r = fortune(a, b);
  r.aStr = a; r.bStr = b;
  render(r);
}

$("btnGo").addEventListener("click", go);
["nameA","nameB"].forEach(id=>{
  $(id).addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
});

// 示例演示
function demo(){
  $("nameA").value = "林晚晴";
  $("nameB").value = "沈慕白";
  go();
}
</script>
</body>
</html>
